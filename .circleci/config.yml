version: 2.1

jobs:
  marmot:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed dataset
          command: |
            printf 'rows = 1000\n' > marmot.in
      - run:
          name: Build marmot engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target marmot -j2
      - run:
          name: Compact dataset
          command: LIONSS_LP=1 ./build/marmot --in marmot.in --codec zstd
  kingfisher-3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load dive model
          command: |
            printf 'depth 0.5\n' > kf.cfg
      - run:
          name: Build splash sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target kingfisher-3 -j2
      - run:
          name: Simulate kingfisher dive
          command: LIONSS_LP=1 ./build/kingfisher-3 --config kf.cfg --refraction 1.33
  rk4_adaptive:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define system
          command: |
            printf 'dydt = -y\n' > ode.txt
      - run:
          name: Build integrator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target rk4_adaptive -j2
      - run:
          name: Integrate with RK4
          command: LIONSS_LP=1 ./build/rk4_adaptive --system ode.txt --tol 1e-8
  coldspring:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
